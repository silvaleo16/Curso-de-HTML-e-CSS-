<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Projeto</title>
    <link rel='stylesheet' href='estudo.css'>
</head>

<body>
    <div class="card">
        <div class="headerLogo">
            <img src="../Projeto-Clio/assets/Logo.png" alt="Logo Renault" class="logo">
        </div>
        <div class="header">
            <h1 class="titulo">Renault Clio</h1>
            <h2 class="subtitulo">A venda</h2>
            <h3 class="destaque">Conforto e Desempenho!</h3>
        </div>

    
        <img src="../Projeto-Clio/assets/ClioVenda3.png" alt="Renault Clio preto" class="imagem">
        
    <!--   <ul>
            <li>Direção hidraulica</li>
            <li>Revisado e pronto para rodar</li>
            <li>Alto-falante nas 4 portas</li>
            <li>Multimidia bluetooth</li>
            <li>13,5L km</li>
            <li>Modulo para subir vidros</li>
            <li>Revisão feita a cada 6 meses</li>
        </ul>
-->
        <div class="beneficios-container">

            <div class="beneficio-item">
                <img class="icone"src="../Projeto-Clio/assets/IconeVolante.png" alt="Direção Hidráulica"></img>
                <span class="beneficio-texto">
                    <span>Direção Hidráulica</span>
                </span>
                <img class="icone" src="../Projeto-Clio/assets/IconeRevisao.png" alt="Revisado e pronto para rodar"></img>
                <span class="beneficio-texto">
                    <span>Revisado</span>
                </span>
                <img class="icone" src="../Projeto-Clio/assets/IconeSom.png"></img>
                <span class="beneficio-texto">
                    <span>Alto-falante nas 4 portas</span>
                </span>
            </div>

            <div class="beneficio-item">
                <img class="icone" src="../Projeto-Clio/assets/iconeMultimidia.png" alt="Multimidia bluetooth"></img>
                <span class="beneficio-texto">
                    <span>Multimidia bluetooth</span>
                </span>
                <img class="icone" src="../Projeto-Clio/assets/IconeConsumo.png" alt="Consumo de combustível"></img>
                <span class="beneficio-texto">
                    <span>Faz 13,5L/km</span>
                </span>
            </div>    

        </div>

            
        <div class="bloco-preco">
            <p class="valor">Valor: R$ 30.000,00</p>
            <button class="button">Falar com o Vendedor</button>
        </div>
    </div>
</body>
